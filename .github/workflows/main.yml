name: Android CI/CD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Accept Android SDK licenses
        run: |
          set +e
          for SM in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$SM" ]; then
              yes | "$SM" --licenses >/dev/null 2>&1
              "$SM" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
              break
            fi
          done
          true

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Build
        run: ./gradlew clean assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Easy-VPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
